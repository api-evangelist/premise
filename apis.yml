name: Premise
description: >-
  Premise is a global data-intelligence platform that combines machine learning
  with a distributed network of on-the-ground human contributors to collect,
  structure, and analyze local ground-truth data across 140+ countries. The
  platform reports 6M+ contributors, 25M+ submissions per year, and 2.3M+ unique
  points of interest, and serves three primary markets: precision mapping and
  geospatial intelligence, international development, and public-sector
  organizations. Premise is a portfolio company of a16z, Anthemis, and GV. As of
  this profile it publishes no public developer API, OpenAPI specification,
  SDKs, or developer portal; data is delivered through managed engagements and
  its customer platform.
